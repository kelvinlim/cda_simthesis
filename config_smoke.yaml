# Tiny grid for dry-runs (not thesis results).
#   python simdata.py --config config_smoke.yaml --cmd sim
#   python tradsim_fastcausal.py --config config_smoke.yaml --cmd compute

general:
  version: 1.0.0

simulation:
  num_samples:
    - 80
  effect_sizes:
    - 0.25
  num_variables: 8
  num_edges: 8
  seed: 43
  data_directory: ./sim_data_smoke
  iterations: 1

discovery:
  algorithm: fges
  alpha: 0.01
  penalty_discount: 1.0
  proportions:
    - 1.0
    - 0.8
  iterations: 2
  output_directory: ./discovery_results/smoke_grid
  run_sem: false
  seed: 2025
  # Tiny SA3 grid (do not combine with a full proportion list).
  missingness:
    enabled: true
    mechanisms:
      - mcar
      - mar
    rates:
      - 0.2
    strategies:
      - complete_case
      - mean
    mar_covariates: null
    mar_slope: 1.5
