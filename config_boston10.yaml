# 10-variable simulation profile matching Boston Set A width (Aims 3–4).
# Keep config.yaml (22 vars / 27 edges) for the original grid.
#
#   python simdata.py --config config_boston10.yaml --cmd sim
#   python tradsim_fastcausal.py --config config_boston10.yaml --cmd compute
#
# Real EMA fixtures (p=10) are fetched separately; see README and
# docs/aims3-4-boston-ema.md. Discovery still runs on sim CSVs + picause .txt.

general:
  version: 1.0.0

simulation:
  num_samples:
    - 10000
  effect_sizes:
    - .1
    - .2
    - .3
  # Set A has 10 columns. 12 edges keeps avg degree ≈ 2.4
  # (same as 22-var / 27-edge: 2*27/22 ≈ 2.45).
  num_variables: 10
  num_edges: 12
  seed: 43
  data_directory: ./sim_data_boston10
  iterations: 10

# fastcausal discovery (tradsim_fastcausal.py). CLI flags override these.
discovery:
  algorithm: fges          # fges | gfci | both
  alpha: 0.01
  penalty_discount: 1.0
  proportions:
    - 1.0
    - 0.9
    - 0.8
    - 0.7
    - 0.6
    - 0.5
    - 0.4
  iterations: 20
  output_directory: ./discovery_results/boston10
  run_sem: false
  seed: 2025
  missingness:
    enabled: false
    mechanisms:
      - mcar
      - mar
    rates:
      - 0.0
      - 0.1
      - 0.2
      - 0.4
    strategies:
      - complete_case
      - mean
    mcar_impute: false
    mar_covariates: null
    mar_slope: 1.5
  hp_sweep:
    enabled: false
    penalty_discounts:
      - 1.0
      - 2.0
      - 4.0
    alphas:
      - 0.01
      - 0.05
    target_fprs:
      - 0.05
      - 0.10
