# config file for simdata project

general:
  version: 1.0.0


simulation:
  num_samples: 
    - 10000
  effect_sizes:
    - .1
    - .2
    - .3
    # - .4
  num_variables: 22
  num_edges: 27
  seed: 43
  data_directory: ./sim_data_v2
  iterations: 10

# fastcausal discovery (tradsim_fastcausal.py). CLI flags override these.
discovery:
  algorithm: fges          # fges | gfci | both
  alpha: 0.01              # GFCI Fisher-Z (legacy tradsim default)
  penalty_discount: 1.0    # SEM-BIC penalty (legacy tradsim default)
  proportions:
    - 1.0
    - 0.9
    - 0.8
    - 0.7
    - 0.6
    - 0.5
    - 0.4
  # 20 is thesis-practical. Use 100 for a “full” profile (legacy NUM_ITERATIONS).
  iterations: 20
  output_directory: ./discovery_results
  # SEM fitting is expensive; enable with --run-sem or run_sem: true
  run_sem: false
  seed: 2025
  # SA3 row-missingness (separate from subsample proportions). Off by default
  # so `python tradsim_fastcausal.py --cmd compute` stays a subsample-only run.
  # Enable with --missingness or missingness.enabled: true, and prefer
  # --proportions 1.0 so the grid stays cheap.
  missingness:
    enabled: false
    mechanisms:
      - mcar
      - mar
    rates:
      - 0.0
      - 0.1
      - 0.2
      - 0.4
    strategies:
      - complete_case   # listwise delete (natural whole-row MCAR handler)
      - mean            # MAR simple impute; skipped for MCAR unless mcar_impute
    # Whole-row MCAR + mean/median just reinserts column-mean rows.
    mcar_impute: false
    # Fully observed columns that drive row-MAR probability.
    # null = first numeric column (picause x_1).
    mar_covariates: null
    mar_slope: 1.5


